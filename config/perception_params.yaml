static_obj_detector:
  ros__parameters:
    voxel_leaf_size: 0.05          # ボクセルグリッドのリーフサイズ (m)
    cluster_tolerance: 0.15        # 同一クラスタとみなす距離閾値 (m)
    min_cluster_size: 15           # クラスタ認定の最小点数
    max_cluster_size: 5000         # クラスタ認定の最大点数
    input_topic: "/livox/lidar"
    target_frame: "map"

    # 固定バケツ① (床面配置: CAD X=0.910, Y=-3.060)
    fixed_bucket_1:
      enabled: true
      center_x: 0.910
      center_y: -3.060
      roi_size_x: 0.60
      roi_size_y: 0.60
      roi_z_min: 0.00
      roi_z_max: 0.26

    # 固定バケツ② (高さ600mm台座: CAD X=1.480, Y=1.180)
    fixed_bucket_2:
      enabled: true
      center_x: 1.480
      center_y: 1.180
      roi_size_x: 0.60
      roi_size_y: 0.60
      roi_z_min: 0.60
      roi_z_max: 0.86

    # 固定バケツ③ (高さ300mm台座: CAD X=1.480, Y=-1.820)
    fixed_bucket_3:
      enabled: true
      center_x: 1.480
      center_y: -1.820
      roi_size_x: 0.60
      roi_size_y: 0.60
      roi_z_min: 0.30
      roi_z_max: 0.56

    # 旗 (高さ3000mm: CAD X=3.065, Y=-3.060)
    flag:
      enabled: true
      center_x: 3.065
      center_y: -3.060
      roi_size_x: 1.00
      roi_size_y: 1.00
      roi_z_min: 2.80
      roi_z_max: 3.05

dynamic_obj_detector:
  ros__parameters:
    voxel_leaf_size: 0.05
    bg_subtraction_radius: 0.10     # 静的マップ点群との近傍判定半径 (m)
    moving_bucket_z_min: 1.2        # 移動バケツの高さ下限 (m)
    moving_bucket_z_max: 2.1        # 移動バケツの高さ上限 (m)
    frame_accumulation_count: 3     # 点群統合フレーム数 (非反復スキャン対策)
    cluster_tolerance: 0.20
    min_cluster_size: 20
    max_cluster_size: 10000
    input_topic: "/livox/lidar"
    map_pcd_path: ""                # 静的マップPCDのパス (空文字列の場合はパッケージのmaps/robocon2026_field.pcdを自動参照)

    # ポリカバケツ透過問題対策 (フォールバック処理)
    enable_clear_bucket_fallback: true
    fallback_base_z_min: 0.1        # ロボット本体・台座の検出高さ範囲下限 (m)
    fallback_base_z_max: 1.0        # ロボット本体・台座の検出高さ範囲上限 (m)
    fallback_virtual_z_offset: 0.80 # 検出された本体重心から仮想移動バケツ中心までの高さオフセット (m)
